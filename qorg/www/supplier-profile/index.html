{% extends "templates/web.html" %}{% block page_content %}<div class="container qorg-procurement-page"><h1>{{ _("Supplier Profile") }}</h1>{% if profile %}<a class="btn btn-primary" href="/app/supplier-registration/{{ profile }}">{{ _("Open Supplier Profile") }}</a><button id="request-update" class="btn btn-outline-primary">{{ _("Request Profile Update") }}</button>{% else %}<a class="btn btn-primary" href="/app/supplier-registration/new-supplier-registration">{{ _("Create Supplier Profile") }}</a>{% endif %}</div>{% if profile %}<script>document.getElementById('request-update').addEventListener('click',()=>{const reason=prompt('{{ _("Reason for update request") }}');if(!reason)return;frappe.call({method:'qorg.qorg.procurement_contracting.portal.request_supplier_profile_update',args:{registration:'{{ profile }}',reason}}).then(()=>frappe.msgprint('{{ _("Update request submitted") }}'));});</script>{% endif %}{% endblock %}
