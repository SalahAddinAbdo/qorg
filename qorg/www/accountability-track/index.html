{% extends "templates/web.html" %}{% block title %}{{ _("Track a Case") }}{% endblock %}{% block page_content %}<div class="container py-5"><h1>{{ _("Secure Case Tracking") }}</h1>{% if enabled %}<form id="qorg-track-form" class="row g-3"><div class="col-md-6"><label class="form-label">{{ _("Case Reference") }}</label><input name="case_reference" class="form-control" required></div><div class="col-md-6"><label class="form-label">{{ _("Tracking Token") }}</label><input name="tracking_token" class="form-control" required></div><div class="col-12"><label class="form-label">{{ _("CAPTCHA Token") }}</label><input name="captcha_token" class="form-control" required></div><div class="col-12"><button class="btn btn-primary" type="submit">{{ _("Track Securely") }}</button></div></form><div id="qorg-track-result" class="mt-4" aria-live="polite"></div><script>document.getElementById('qorg-track-form').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target),args=Object.fromEntries(f.entries());const r=await frappe.call({method:'qorg.qorg.governance_accountability.portal.track_accountability_case',args});if(r.message)document.getElementById('qorg-track-result').innerHTML=`<div class="alert alert-info"><strong>${frappe.utils.escape_html(r.message.case_reference)}</strong><br>{{ _("Status") }}: ${frappe.utils.escape_html(r.message.status)}</div>`;});</script>{% else %}<div class="alert alert-warning">{{ _("Public tracking is not currently enabled.") }}</div>{% endif %}<a class="btn btn-outline-primary mt-3" href="/accountability">{{ _("Submit a New Case") }}</a></div>{% endblock %}
