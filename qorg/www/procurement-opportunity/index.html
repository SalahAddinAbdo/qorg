{% extends "templates/web.html" %}{% block page_content %}<div class="container qorg-procurement-page"><h1>{{ notice.title }}</h1><p>{{ notice.summary or '' }}</p><p><b>{{ _("Deadline") }}:</b> {{ notice.deadline }}</p>{% if frappe.session.user == 'Guest' %}<a class="btn btn-primary" href="/login?redirect-to=/procurement-opportunity?route={{ notice.route }}">{{ _("Login to Apply") }}</a>{% else %}<a class="btn btn-primary" href="/tender-submission?name=new-procurement-submission?procurement_notice={{ notice.name }}&procurement_process={{ notice.procurement_process }}">{{ _("Apply") }}</a>{% endif %}</div>{% endblock %}
